<div class="container mt-4 mb-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-header text-center bg-primary text-white">
                    <h3>Uploader un fichier audio</h3>
                </div>
                <div class="card-body">
                    <form action="/model/uploadfile" method="post" enctype="multipart/form-data" id="uploadForm">
                        <div class="mb-3">
                            <label for="file" class="form-label">Choisir un fichier audio (.wav, .mp3)</label>
                            <input type="file" class="form-control" id="file" name="file" accept=".wav, .mp3, .ogg" required>
                            <div class="form-text">Taille max : 4 Mo</div>
                            <div id="fileFeedback" class="form-text text-danger"></div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Uploader</button>
                        </div>
                    </form>
                    <div id="uploadStatus" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Vérification de la taille du fichier avant soumission
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        var fileInput = document.getElementById('file');
        var file = fileInput.files[0];
        var fileFeedback = document.getElementById('fileFeedback');
        var uploadStatus = document.getElementById('uploadStatus');

        if (file && file.size > 4 * 1024 * 1024) { // 4 Mo
            e.preventDefault(); // Empêche la soumission du formulaire
            fileFeedback.textContent = 'Le fichier dépasse la taille maximale de 4 Mo.';
            uploadStatus.textContent = '';
        } else {
            fileFeedback.textContent = '';
            uploadStatus.textContent = 'Téléchargement en cours...';
        }
    });
</script>

{% endblock %}
