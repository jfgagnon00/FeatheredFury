{% extends "layout.html" %}
{% block content %}

<br />
<br />
<h2>Connexion</h2>

<form method="POST">
    <!-- UserName input -->
    <div data-mdb-input-init class="form-outline mb-4">
        <label class="form-label" for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Nom d'utilisateur" required />
    </div>

    <br />

    <!-- Password input -->
    <div data-mdb-input-init class="form-outline mb-4">
        <label class="form-label" for="Mot de passe">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Mot de passe" required />
    </div>
    <br />

    <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Sign in</button>
    </div><!-- Submit button -->

    <br />
    <!-- 2 column grid layout for inline styling -->
    <div class="row mb-4">
        <div class="col d-flex justify-content-center">
            <!-- Checkbox -->
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
                <label class="form-check-label" for="form2Example31"> Remember me </label>
            </div>
        </div>

        <div class="col">
            <!-- Simple link -->
            <a href="#!">Forgot password?</a>
        </div>
    </div>
    <br />
    <!-- Register buttons -->
    <div class="row mb-4">
        <div class="col d-flex justify-content-center">
            <p>Not a member? <a href="/auth/register">Register</a></p>
        </div>
    </div>
</form>
{% endblock %}
