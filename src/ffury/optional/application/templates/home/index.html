{% extends "layout.html" %}

{% block content %}

<div class="container mt-4 mb-4">
    <div class="row justify-content-center">
        <div class="card shadow-lg">
            <div class="list-group"></div>
            <div class="card-body">
                <form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
                    <div class="mb-3">
                        <label for="file" class="form-label">Choisir un fichier audio ({{ allowed_extensions }})</label>
                        <input type="file" class="form-control" id="file" name="file" accept="{{ allowed_extensions }}" required>
                        <div class="form-text">Taille max : {{ max_centent_length }} Mb</div>
                        <div id="fileFeedback" class="form-text text-danger"></div>
                    </div>
                    <div class="list-group"></div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Uploader</button>
                    </div>
                </form>
                <div id="uploadStatus" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
<script>document.getElementById('file').addEventListener('change', function() {
    console.log('Fichier sélectionné :', this.files[0].name);
});</script>

{% endblock %}
