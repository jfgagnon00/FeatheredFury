name: "Terraform Deploy"
description: "Deploie application + service sur azure"

inputs:
  TERRAFORM_ENVIRONMENT:
    description: "Environment sur lequel deployer"
    required: true

  AZURE_CREDENTIALS:
    required: true

runs:
  using: "composite"
  steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.14.2' # the full version of `docker-compose` command

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ inputs.AZURE_CREDENTIALS }}

      - name: Deploy ${{ inputs.TERRAFORM_ENVIRONMENT }}
        env:
          TERRAFORM_ENVIRONMENT: ${{ inputs.TERRAFORM_ENVIRONMENT }}
        shell: bash
        run: |
          cd .cd 
          terraform init

          terraform plan -var="environment=${TERRAFORM_ENVIRONMENT}"
          
          # terraform refresh -var="environment=${TERRAFORM_ENVIRONMENT}"
          # terraform destroy -var="environment=${TERRAFORM_ENVIRONMENT}" -auto-approve
          # terraform plan -var="environment=${TERRAFORM_ENVIRONMENT}"
          
          terraform apply -var="environment=${TERRAFORM_ENVIRONMENT}" -auto-approve
