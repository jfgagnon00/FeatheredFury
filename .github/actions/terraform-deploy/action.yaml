name: "Terraform Deploy"
description: "Deploie application + service sur azure"

inputs:
  TERRAFORM_ENVIRONMENT:
    description: "Environment sur lequel deployer"
    required: true

runs:
  using: "composite"
  steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Deploy ${{ inputs.TERRAFORM_ENVIRONMENT }}
        env:
          TERRAFORM_ENVIRONMENT: ${{ inputs.TERRAFORM_ENVIRONMENT }}
        shell: bash
        run: |
          cd .cd
          terraform init
          terraform plan -var="environment=${TERRAFORM_ENVIRONMENT}"
          terraform apply -auto-approve
