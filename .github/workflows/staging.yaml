name: "Staging Workflow"
on:
  push:
    branches:
      - staging
jobs:
  Deployment:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Check folders
        shell: bash
        run: |
          pwd
          ls -la
          ls -la ./.github/actions/
          ls -la ./.github/actions/neptune-sync-model

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-build-environment

      - name: Synchroniser Modele
        uses: ./.github/actions/neptune-sync-model@staging
        with:
          NEPTUNE_API_TOKEN: ${{ secrets.NEPTUNE_API_TOKEN }}
          NEPTUNE_TAG: ${{ secrets.NEPTUNE_TAG }}

      - name: Test Sync
        shell: bash
        run: |
          ls -la ./models
          echo "Ici"


