name: "Production Workflow"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/workflows/metric_monitoring.yaml"

jobs:
  ProductionDeployment:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Environment
        uses: ./.github/actions/setup-build-environment

      - name: Synchroniser Donnees
        uses: ./.github/actions/dvc-sync
        with:
          GDRIVE_URL: ${{ secrets.GDRIVE_URL }}
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

      - name: Synchroniser Modele
        uses: ./.github/actions/neptune-sync-model
        with:
          NEPTUNE_API_TOKEN: ${{ secrets.NEPTUNE_API_TOKEN }}
          NEPTUNE_TAG: production_latest

      - name: Deploy Production
        uses: ./.github/actions/terraform-deploy
        with:
          TERRAFORM_ENVIRONMENT: production
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
