name: Production Metric Monitoring
on:
  push:
    branches:
      - main
  schedule:
    - cron: ${{vars.MONITORING_CRON_FREQEUNCY}}
jobs:
  MetricMonitoring:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Environment
        run: |
          pip install -r .ci/requirements-build.txt

      - name: Monitoring
        env:
          NEPTUNE_PROJECT: ${{ secrets.NEPTUNE_PROJECT }}
          NEPTUNE_TAG: ${{ secrets.NEPTUNE_TAG }}
          NEPTUNE_API_TOKEN: ${{ secrets.NEPTUNE_API_TOKEN }}
        run: |
          ffury metric analyze 
