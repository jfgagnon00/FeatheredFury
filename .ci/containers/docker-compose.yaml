# Remarque : sans ports, les services ne sont accessibles que 
# par d'autres services du reseau ffury_network.
# L'access se fait par le nom du service. Ex)
# http://ffury_service:5001
services:
  ffury_application:
    platform: ${FFURY_PLATFORM}
    build:
      # se positionner a la racine du projet
      context: ../..
      dockerfile: .ci/containers/docker-application
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        PORT: ${FFURY_APPLICATION_PORT}
    image: ffury-web_app
    environment:
      - FFURY_SERVICE_PORT=${FFURY_SERVICE_PORT}
      - FFURY_SERVICE_HOST=${FFURY_SERVICE_HOST}
    ports:
      # accessible depuis browser
      - "80:${FFURY_APPLICATION_PORT}"
    depends_on:
      - ffury_service
    networks:
      - ffury_network

  ffury_service:
    platform: ${FFURY_PLATFORM}
    build:
      # se positionner a la racine du projet
      context: ../..
      dockerfile: .ci/containers/docker-service
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        PORT: ${FFURY_SERVICE_PORT}
        AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
    image: ffury-web_service
    ports:
      - "${FFURY_SERVICE_PORT}:${FFURY_SERVICE_PORT}"
    networks:
      - ffury_network

networks:
  ffury_network:
    driver: bridge
