!ffury.configs.PreprocessConfig

# split - somme != 1, valildation prend le reste
split_train_size: 0.6
split_test_size: 0.2

# sampling - transforme audio clip en groupe/segments
segment_size_ms: 1500
segment_overlap_size_ms: 500
group_segment_count: 5
group_count: 1372

# spectrogramme
clip_sampling_rate_hz: 22050 # implitement mono
spectrogram_stft_window_size_ms: 100
spectrogram_stft_frame_size_ms: 50
spectrogram_fmin: 500
spectrogram_fmax: 10000
spectrogram_n_mels: 100
