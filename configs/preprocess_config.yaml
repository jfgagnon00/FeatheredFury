!ffury.configs.PreprocessConfig

# split - somme != 1, valildation prend le reste
split_train_size: 0.6
split_test_size: 0.2

# sampling - transforme audio clip en groupe/segments
segment_size_ms: 2000
segment_overlap_size_ms: 1000
group_segment_count: 7
group_count: 3000

# spectrogramme
clip_sampling_rate_hz: 22050 # implicitement mono
spectrogram_stft_window_size_ms: 150
spectrogram_stft_frame_size_ms: 100
spectrogram_fmin: 500
spectrogram_fmax: 10000
spectrogram_n_mels: 100

# segmentation - 'classifie' les frames du spectogramme en 
#                'contient'/'ne contient pas' des chants d'oiseaux
segmentation_size_ms: 5000
segmentation_sigma_scale: 0.4
segmentation_content_ratio_threshold: 0.5
segmentation_erosion_shape: [3, 3]
segmentation_dilation_shape: [3, 3]
segmentation_fmin: 1000
segmentation_fmax: 9000